name: CI

on:
  push:
    branches: 
      - '*'
    tags:
      - v*
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_dispatch: {}

jobs:
  cores:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        docker_owner: [ps2dev]
        core_opts: [
          #[race_libretro, race_libretro_ps2],
          [njemu_libretro, njemu_libretro_ps2],
          #[libretro-handy, handy_libretro_ps2],
          #[bsnes-libretro, bsnes_libretro_ps2],
          #[dice-libretro, dice_libretro_ps2],
          #[ecwolf, ecwolf_libretro_ps2],
          #[fbalpha2012_cps1, fbalpha2012_cps1_libretro_ps2],
          #[fbalpha2012_cps2, fbalpha2012_cps2_libretro_ps2],
          #[gambatte-libretro, gambatte_libretro_ps2],
          #[geargrafx, geargrafx_libretro_ps2],
          #[genesis_plus_gx_libretro, genesis_plus_gx_libretro_ps2],
          #[gpsp, gpsp_libretro_ps2],
          #[gw-libretro, gw-libretro_ps2],
          #[libretro-prboom, prboom_libretro_ps2],
          #[libretro-samples, test_libretro_ps2],
          #[libretro-lutro, lutro_libretro_ps2],
          #[libretro-fceumm, fceumm_libretro_ps2],
          #[libretro-cap32, cap32_libretro_ps2],
          #[libretro-mame, libretro-mame_ps2],
          #[mame2000-libretro, mame2000-libretro_ps2],
          #[mame2010-libretro, mame2010-libretro_ps2],
          #[mame2003-libretro, mame2003_libretro_ps2],
          #[mame2003-plus-libretro, mame2003-plus-libretro_ps2], <--NOT WORKING
          #[mgba, mgba_libretro_ps2], <--NOT WORKING
          #[mednafen-pce-libretro, mednafen_pce_libretro_ps2],
          #[mednafen-pce-fast-libretro, mednafen_pce_fast_libretro_ps2],
          #[mednafen-lynx-libretro, mednafen-lynx-libretro_ps2],
          #[mednafen-ngp-libretro, mednafen-ngp-libretro_ps2],
          #[mednafen-vb-libretro, mednafen-vb-libretro_ps2],
          #[mednafen-wswan-libretro, mednafen-wswan-libretro_ps2],
          #[mednafen-supergrafx-libretro, mednafen-supergrafx-libretro_ps2],
          #[neocd_libretro, neocd_libretro_ps2],
          #[pokemini, pokemini_libretro_ps2],
          #[picodrive, picodrive_libretro_ps2],
          #[potator, potator_libretro_ps2],
          #[QuickNES_Core, quicknes_libretro_ps2],
          #[stella2014-libretro, stella2014_libretro_ps2],
          #[snes9x2002, snes9x2002_libretro_ps2],
          #[snes9x2010-libretro, snes9x2010_libretro_ps2], <--NOT WORKING
          #[zc210-libretro, zc210-libretro_ps2],
        
         ]
      fail-fast: false

    container: ${{ matrix.docker_owner }}/ps2dev:latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apk update
        apk add --no-cache \
          build-base \
          git \
          bash \
          cmake \
          make \
          dos2unix \
          sdl12-compat-dev \
          pkgconfig \
          alsa-lib-dev \
          fontconfig-dev
    
    - name: Grant execute permissions and redirect Bitbucket to GitHub
      run: |
        chmod +x *.sh
        chmod +x ./cores/*.sh
        git config --global url."https://github.com/ECWolfEngine/".insteadOf "https://bitbucket.org/ecwolf/"

    - name: Setup toolchain aliases
      run: |
        ln -s /usr/local/ps2dev/ee/bin/mips64r5900el-ps2-elf-gcc /usr/local/ps2dev/ee/bin/ee-gcc
        ln -s /usr/local/ps2dev/ee/bin/mips64r5900el-ps2-elf-g++ /usr/local/ps2dev/ee/bin/ee-g++
        ln -s /usr/local/ps2dev/ee/bin/mips64r5900el-ps2-elf-ar /usr/local/ps2dev/ee/bin/ee-ar

    - name: Compile project
      run: |
        export CFLAGS="-Wno-error=incompatible-pointer-types"
        ./prepare_release.sh
        ./prepare_retroarch.sh
        rm -rf ecwolf/deps/SDL deps/SDL
        ./cores/${{ matrix.core_opts[0] }}.sh
        ./generate_retroarch.sh ${{ matrix.core_opts[0] }} ${{ matrix.core_opts[1] }}

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: core-${{ matrix.core_opts[0] }}-${{ matrix.docker_owner }}-${{ steps.slug.outputs.sha8 }}
        path: RA/


  libretro-salamander:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        docker_owner: [ps2dev]
      fail-fast: false

    container: ${{ matrix.docker_owner }}/ps2dev:latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apk add build-base git bash

    - name: Grant execute permissions
      run: |
        chmod +x *.sh

    - name: Setup toolchain aliases
      run: |
        ln -s /usr/local/ps2dev/ee/bin/mips64r5900el-ps2-elf-gcc /usr/local/ps2dev/ee/bin/ee-gcc
        ln -s /usr/local/ps2dev/ee/bin/mips64r5900el-ps2-elf-g++ /usr/local/ps2dev/ee/bin/ee-g++
        ln -s /usr/local/ps2dev/ee/bin/mips64r5900el-ps2-elf-ar /usr/local/ps2dev/ee/bin/ee-ar

    - name: Compile project
      run: |
        ./prepare_release.sh
        ./prepare_retroarch.sh
        ./generate_salamander.sh
        
    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: salamander-${{ matrix.docker_owner }}-${{ steps.slug.outputs.sha8 }}
        path: RA/


  libretro-info-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        docker_owner: [ps2dev]

    container: ${{ matrix.docker_owner }}/ps2dev:latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apk add build-base git bash

    - name: Grant execute permissions
      run: |
        chmod +x *.sh

    - name: Compile project
      run: |
        ./prepare_release.sh
        ./libretro-core-info.sh

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: core-info-${{ matrix.docker_owner }}-${{ steps.slug.outputs.sha8 }}
        path: RA/

  combine-artifacts:
    needs: [cores, libretro-salamander, libretro-info-core]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        docker_owner: [ps2dev]
    steps:
      - name: Get short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-${{ matrix.docker_owner }}-${{ steps.slug.outputs.sha8 }}"
          merge-multiple: true

      - name: Create final artifact
        run: |
          mkdir -p final-artifact
          cp -r artifacts/* final-artifact/

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: RA-${{ matrix.docker_owner }}-${{ steps.slug.outputs.sha8 }}
          path: final-artifact/

      - name: Delete core artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: "core-*-${{ matrix.docker_owner }}-${{ steps.slug.outputs.sha8 }}"

      - name: Delete salamander artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: "salamander-${{ matrix.docker_owner }}-${{ steps.slug.outputs.sha8 }}"

      - name: Delete core-info artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: "core-info-${{ matrix.docker_owner }}-${{ steps.slug.outputs.sha8 }}"
