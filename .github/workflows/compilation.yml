name: CI

on:
  push:
    branches: 
      - '*'
    tags:
      - v*
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  cores:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        docker_owner: [orbisdev]
        core_opts: [
          [gambatte-libretro, gambatte_libretro_orbis],
          [libretro-samples, test_libretro_orbis],
          [blueMSX-libretro, bluemsx_libretro_orbis],
          [fmsx-libretro, fmsx_libretro_orbis],
          # [libretro-prboom, prboom_libretro_orbis],
          # [picodrive, picodrive_libretro_orbis],
          # [ecwolf, ecwolf_libretro_orbis],
          # [snes9x2002, snes9x2002_libretro_orbis],
          # [libretro-lutro, lutro_libretro_orbis],
          # [gpsp, gpsp_libretro_orbis],
          # [libretro-fceumm, fceumm_libretro_orbis],
         ]

    container: ${{ matrix.docker_owner }}/orbisdev:latest
    steps:
    - uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        apk add build-base git bash python2
    
    - name: Compile project
      run: |
        ./prepare_release.sh
        ./prepare_retroarch.sh
        ./cores/${{ matrix.core_opts[0] }}.sh
        ./generate_retroarch.sh ${{ matrix.core_opts[0] }} ${{ matrix.core_opts[1] }}

    - name: Get short SHA
      id: slug
      run: echo "::set-output name=sha8::$(echo ${GITHUB_SHA} | cut -c1-8)"

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: RA-${{ matrix.docker_owner }}-${{ steps.slug.outputs.sha8 }}
        path: RA/


